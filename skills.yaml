# Skill taxonomy read by cv.py:parse_cv. Each canonical skill lists the ALIASES
# as they literally appear in job descriptions - cv parse emits every alias into
# the derived skill_weights and topic_must_match, because the filter matches
# skill_weights keys and topic_must_match regexes LITERALLY over the job text
# (tracker.py Filter). So "amazon web services" and "ec2" must both be here, not
# just the label "aws". Canonical labels/domain names are never emitted, only
# aliases. weight reuses profile.yaml's 1-6 scale. domain drives which cluster
# becomes topic_must_match (the dominant domain of the CV).
#
# Punctuation aliases (.NET, C++, C#) are matched by cv.py:boundary_for, not the
# plain word-boundary regex - keep them spelled exactly as they appear.

