# company -> ATS board. `run.py discover` fills in ats/token for entries marked `ats: unknown`.
# verified: true means a real board was fetched and its postings matched the company.
# Set `enabled: false` to skip a company without deleting it.
#
# ats values: greenhouse | lever | ashby | workable | smartrecruiters | recruitee
#             personio | teamtailor | bamboohr | workday | unknown
# workday token format: "tenant|wd3|SiteName"

companies:
  # ---------------------------------------------------------- e-commerce / marketplace
  - {name: Trendyol,       domain: trendyol.com,       ats: lever,    token: trendyol,   verified: true,  group: ecommerce}
  - {name: Hepsiburada,    domain: hepsiburada.com,    ats: unknown,  token: null,       group: ecommerce}
  # Discovery (2026-09-14) found real tokens for these two, but on ATS families
  # with no sources.fetch_<ats> yet: Getir -> careers-page:getir-2 (Manatal),
  # Sahibinden -> successfactors:47bdcda0. Left as unknown so nothing fetches a
  # token that has never been verified against a live board.
  - {name: Getir,          domain: getir.com,          ats: unknown,  token: null,       group: ecommerce}
  - {name: Sahibinden,     domain: sahibinden.com,     ats: unknown,  token: null,       group: ecommerce}
  - {name: Dolap,          domain: dolap.com,          ats: unknown,  token: null,       group: ecommerce}
  - {name: Modanisa,       domain: modanisa.com,       ats: unknown,  token: null,       group: ecommerce}
  # Genuine token, but the board holds a single non-technical posting - this is
  # not where Ciceksepeti actually recruits. Re-run discovery for their real one.
  - {name: Ciceksepeti,    domain: ciceksepeti.com,    ats: lever,  token: ciceksepeti,       verified: true, group: ecommerce}
  - {name: n11,            domain: n11.com,            ats: unknown,  token: null,       group: ecommerce}
  - {name: Vivense,        domain: vivense.com,        ats: unknown,  token: null,       group: ecommerce}
